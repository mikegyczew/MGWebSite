<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Michael — Projekty</title>
  <style>
    :root {
      --bg:#0b1020; --card:#121a2e; --card2:#18223b; --text:#eef2ff;
      --muted:#aab5d0; --accent:#65d6ff; --accent2:#8b7cff; --border:#263352;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,#090d19,#101a31);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;line-height:1.65}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .container{max-width:1100px;margin:auto;padding:32px 22px 70px}
    nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0 35px}
    .logo{font-weight:800;letter-spacing:.5px}
    .navlinks{display:flex;gap:22px}
    .hero{padding:55px 0 45px;display:grid;grid-template-columns:1.5fr 1fr;gap:35px;align-items:center}
    .kicker{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:13px}
    h1{font-size:clamp(42px,6vw,72px);line-height:1.02;margin:14px 0 20px}
    h2{font-size:30px;margin:0 0 18px}
    h3{margin:0 0 8px;font-size:19px}
    .lead{font-size:20px;color:var(--muted);max-width:720px}
    .card{background:rgba(18,26,46,.82);border:1px solid var(--border);border-radius:18px;padding:24px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .two{grid-template-columns:repeat(2,1fr)}
    section{margin-top:55px}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .tag{background:#1b2743;border:1px solid #30405f;padding:5px 10px;border-radius:999px;color:#cbd6ef;font-size:13px}
    .muted{color:var(--muted)}
    .number{font-size:36px;font-weight:800;color:var(--accent)}
    footer{margin-top:70px;padding-top:25px;border-top:1px solid var(--border);color:var(--muted)}
    @media(max-width:800px){.hero,.grid,.two{grid-template-columns:1fr}.navlinks{gap:10px;font-size:14px}.hero{padding-top:25px}}
  </style>
</head>
<body>
  <div class="container" id="projects-page"></div>

  <script>
    async function renderProjectsPage() {
      const response = await fetch('/api/projects');
      const data = await response.json();
      const root = document.getElementById('projects-page');

      const sectionsHtml = (data.sections || []).map(section => {
        const cardsHtml = (section.items || []).map(item => {
          const tagsHtml = (item.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');
          return `
            <div class="card">
              <h3>${item.title}</h3>
              <p>${item.description}</p>
              ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
            </div>
          `;
        }).join('');

        return `
          <section>
            <h2>${section.heading}</h2>
            <div class="grid ${section.layout === 'two' ? 'two' : ''}">${cardsHtml}</div>
          </section>
        `;
      }).join('');

      root.innerHTML = `
        <nav>
          <div class="logo">${data.brand}</div>
          <div class="navlinks">
            <a href="about.html">O mnie</a>
            <a href="project.html">Projekty</a>
          </div>
        </nav>

        <div class="hero">
          <div>
            <div class="kicker">${data.hero.kicker}</div>
            <h1>${data.hero.title}</h1>
            <p class="lead">${data.hero.lead}</p>
          </div>
          <div class="card">
            <div class="number">${data.hero.stat_value}</div>
            <p class="muted">${data.hero.stat_text}</p>
          </div>
        </div>

        ${sectionsHtml}

        <footer>© 2026 Michael · <a href="about.html">← O mnie</a></footer>
      `;
    }

    renderProjectsPage();
  </script>
</body>
</html>
